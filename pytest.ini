[pytest]
testpaths = .
python_files = test_*.py
norecursedirs = docs docs_agent docs_fastapi chroma_db_ta* __pycache__ .git

# 默认只跑「快、免费、不调大模型」的部分 —— 这就是 CI 里跑的那一套。
# 标了 llm 的用例要 ARK_API_KEY、会产生费用、且受接口限流影响，默认排除。
addopts = -q -m "not llm"

markers =
    llm: 需要调用云端大模型（要 ARK_API_KEY，产生费用，可能被限流）。默认跳过。
