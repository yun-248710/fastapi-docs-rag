[pytest]
testpaths = .
python_files = test_*.py
norecursedirs = docs docs_agent docs_fastapi chroma_db_ta* __pycache__ .git

# 默认跑「快、免费、不调大模型」的部分。
# 标了 llm 的用例要 ARK_API_KEY、会产生费用、且受接口限流影响，默认排除。
addopts = -q -m "not llm"

markers =
    llm: 需要调用云端大模型（要 ARK_API_KEY，产生费用，可能被限流）。默认跳过。
    needs_index: 需要向量库 + 本地 Ollama（embedding）。
        这类用例在没装 Ollama 的机器上会跳过，而不是报一堆 ConnectionError。
        想只跑「零依赖」的元测试：pytest -m "not needs_index"
